# 🤖 KCI bot săn cổ phiếu — chạy bot_hunt.py mỗi ngày làm việc lúc 16:30 giờ Hàn (sau giờ đóng cửa 15:30)
# và gửi báo cáo Telegram. Ngày sàn nghỉ: bot tự nhận biết (KOSPI không có phiên) và không gửi.
# Cần 3 GitHub Secrets (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, DART_API_KEY
name: Bot săn cổ phiếu

on:
  schedule:
    - cron: "30 7 * * 1-5"        # 07:30 UTC = 16:30 KST, thứ 2–6
  workflow_dispatch: {}           # chạy tay: tab Actions → Bot săn cổ phiếu → Run workflow

concurrency:
  group: bot-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # trạng thái lần trước (để báo mã mới/rớt) + BCTC DART đã nộp (không đổi) — giữ giữa các lần chạy
      - name: Khôi phục trạng thái
        uses: actions/cache/restore@v4
        with:
          path: |
            bot_state.json
            .cache
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Quét & gửi Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python bot_hunt.py

      - name: Lưu trạng thái
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            bot_state.json
            .cache
          key: bot-state-${{ github.run_id }}
